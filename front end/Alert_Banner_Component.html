<!DOCTYPE html>
<html>
<head>
  <style>
    .alert-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #fef2f2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 4px;
      margin: 10px 0;
    }
    .alert-banner button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    @media (max-width: 480px) {
      .alert-banner {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="alert-banner">
    <span><strong>Critical Alert:</strong> High memory utilization detected (92%)</span>
    <button onclick="this.parentElement.style.display='none'">Dismiss</button>
  </div>
</body>
</html>
